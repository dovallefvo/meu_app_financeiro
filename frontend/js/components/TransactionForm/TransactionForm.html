<div class="modal-overlay" id="modal">
    <div class="modal-surface">
        <h2 id="modal-title">Nova Transação</h2>
        <form id="form-transacao" autocomplete="off">
            <input type="hidden" id="transacao-id">
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Moeda</label>
                    <select id="moeda" required></select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Valor</label>
                    <input type="number" id="valor" step="0.01" min="0.01" required>
                </div>
            </div>
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select id="forma-pagamento" required></select>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="descricao" list="lista-descricoes" required>
                <datalist id="lista-descricoes"></datalist>
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipo" required></select>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Categoria</label>
                    <input type="text" id="categoria" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Subcategoria</label>
                    <input type="text" id="subcategoria">
                </div>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-cancelar" class="btn-text">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
